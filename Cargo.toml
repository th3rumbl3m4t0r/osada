[package]
name = "osada"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["th3rumbl3m4t0r"]
description = "Self-hosted files, wiki and groupware for a household or an organisation"
license = "AGPL-3.0-only"
publish = false

[dependencies]
# osada 0.1's (src/osada1)
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1"
rand = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
async-trait = "0.1"
mime_guess = "2"
percent-encoding = "2"
httpdate = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
libc = "0.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
jpeg-decoder = { version = "0.3", default-features = false }
kamadak-exif = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rsa = "0.9"
flate2 = "1"
# 0.2's
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
sha2 = "0.10"
hex = "0.4"
ring = "0.17"
qrcodegen = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
axum = "0.8"
# WebSocket (HTTP upgrade) through a site's routes (websrv.rs); the versions axum uses
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
